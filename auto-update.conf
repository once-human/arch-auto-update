# /etc/auto-update.conf — settings for the auto-update service.
# Edit with: sudo nano /etc/auto-update.conf   (no restart needed)

# Who gets desktop notifications (filled in by the installer).
NOTIFY_USER="__USER__"

# Minimum hours between automatic upgrades. The timer checks hourly,
# but only actually upgrades once this much time has passed.
MIN_INTERVAL_HOURS=24

# If any pending update matches one of these patterns, the WHOLE upgrade
# is skipped and you get one notification asking you to run it yourself.
# (Skipping everything instead of just that package avoids partial
# upgrades, which are what actually break Arch.)
# Shell glob patterns, space separated. Patterns for packages you don't
# have installed are harmless.
HOLD_PKGS="hyprland hyprland-* aquamarine hyprutils hyprlang quickshell* nvidia nvidia-* grub"

# Pause automatic upgrades whenever a new Arch news post appears
# (that's where "manual intervention required" is announced).
# Clear it with: sudo auto-update ack
CHECK_ARCH_NEWS=1

# Take a snapshot before upgrading, if Timeshift or Snapper is installed.
# (If you use snap-pac or timeshift-autosnap, those already do it.)
SNAPSHOT_BEFORE=1

# Also update Flatpak apps (if Flatpak is installed).
UPDATE_FLATPAK=1

# Minimum free space on / (in MB) before an upgrade is attempted.
MIN_FREE_MB=3072

# Live notifications while updating: "Updating your system" when it starts,
# a progress bar (download % → install % with package names) that updates
# in place, and "System updated ✓" at the end. 0 = silent unless something
# needs you.
SHOW_PROGRESS=1
